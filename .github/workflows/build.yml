name: Build

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run unit tests in Docker (go vet + go test ./...)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -o dist/da_${{ matrix.goos }}_${{ matrix.goarch }} ./cmd/da
      - uses: actions/upload-artifact@v4
        with:
          name: da_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/da_${{ matrix.goos }}_${{ matrix.goarch }}
          retention-days: 30

  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            manager: apt
          - image: debian:12
            manager: apt
          - image: fedora:41
            manager: dnf
          - image: archlinux:latest
            manager: pacman
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: da_linux_amd64
          path: dist
      - run: |
          chmod +x dist/da_linux_amd64
          cp dist/da_linux_amd64 da
      - name: da pull in a fresh ${{ matrix.image }} container
        run: |
          docker run --rm -v "${{ github.workspace }}":/work -w /work "${{ matrix.image }}" \
            sh /work/test/smoke.sh "${{ matrix.manager }}" "${{ matrix.image }}"

  release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: da_*
          merge-multiple: true
      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/da_* \
            --title "latest (develop)" \
            --notes "Automated build from develop @ ${{ github.sha }}" \
            --target "${{ github.sha }}"
